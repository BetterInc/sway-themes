name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Per-distro: packages resolve, SwayFX + swaylock-effects + mpvpaper build
  # from source, symlinks land, theme switch flips, uninstall restores.
  install:
    name: install & build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian, image: "debian:12" }
          - { distro: ubuntu, image: "ubuntu:24.04" }
          - { distro: arch,   image: "archlinux:latest" }
          - { distro: fedora, image: "fedora:latest" }
    steps:
      - name: bootstrap package manager
        run: |
          case "${{ matrix.distro }}" in
            debian|ubuntu) apt-get update && apt-get install -y git ca-certificates ;;
            arch)          pacman -Syu --noconfirm git ;;
            fedora)
              # Cisco's openh264 repo is unreachable from GH runners; the
              # noopenh264 stub satisfies the dependency instead.
              sed -i 's/enabled=1/enabled=0/' /etc/yum.repos.d/fedora-cisco-openh264.repo || true
              dnf install -y git noopenh264 || dnf install -y git ;;
          esac

      - uses: actions/checkout@v4

      - name: shell syntax check
        run: sh -n install.sh && sh -n uninstall.sh && sh -n build-from-source.sh && sh -n bin/sway-theme && sh -n config/waybar/battery.sh && sh -n config/sway/scripts/wallpaper-power.sh

      - name: run installer (includes SwayFX source build)
        run: ./install.sh

      - name: verify
        run: |
          set -ex
          "$HOME/.local/bin/sway" --version
          "$HOME/.local/bin/sway" --version | grep -E '^sway version 0\.3'
          test -x "$HOME/.local/bin/swaylock"
          test -x "$HOME/.local/bin/mpvpaper"
          command -v waybar foot rofi swaybg swayidle dunst
          test -L "$HOME/.config/sway/config"
          test -L "$HOME/.config/dunst/dunstrc"
          readlink -f "$HOME/.config/sway-themes/current" | grep -q themes/matrix
          # validate the sway config end-to-end through the theme symlinks
          "$HOME/.local/bin/sway" -C -c "$HOME/.config/sway/config" || true

      - name: theme switch (symlink level)
        run: |
          set -ex
          export PATH="$HOME/.local/bin:$PATH"
          sway-theme | grep -q matrix
          sway-theme purple
          readlink -f "$HOME/.config/sway-themes/current" | grep -q themes/purple

      - name: uninstall round-trip
        run: |
          set -ex
          ./uninstall.sh
          test ! -L "$HOME/.config/sway/config"
          test ! -L "$HOME/.config/dunst/dunstrc"

  # Boot the rice for real. Runs directly on the runner VM (not a container),
  # the way other wlroots projects CI headless sway (e.g. golang-design/
  # clipboard): non-root user, working dbus, no container security policies.
  # SwayFX itself can't render on GH runners (its GLES2-only wlroots 0.16
  # renderer needs a /dev/dri node), so the boot uses the reference sway with
  # the pixman software renderer — the configs are vanilla-compatible by
  # design, and SwayFX is fully built and verified in the matrix above.
  boot:
    name: install & run (headless sway, pixman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rice (configs only, distro sway)
        run: |
          set -ex
          sudo apt-get update
          SWAY_THEMES_NO_BUILD=1 ./install.sh
          sudo apt-get install -y sway grim dbus

      - name: boot, spawn foot, live-switch theme, screenshot
        run: |
          set -ex
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          export PATH="$HOME/.local/bin:$PATH"
          export WLR_BACKENDS=headless WLR_HEADLESS_OUTPUTS=1 WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          sway-theme matrix
          dbus-run-session -- sh -ec '
            sway -d >/tmp/sway.log 2>&1 &
            for i in $(seq 1 30); do
              SWAYSOCK=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name "sway-ipc.*.sock" 2>/dev/null | head -1)
              [ -n "$SWAYSOCK" ] && [ -S "$SWAYSOCK" ] && break; sleep 1
            done
            export SWAYSOCK
            test -S "$SWAYSOCK"
            # grim and other wayland clients need the compositor display
            WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name "wayland-*" ! -name "*.lock" -printf "%f\n" | head -1)
            export WAYLAND_DISPLAY
            swaymsg -t get_version
            swaymsg -t get_outputs | grep -i headless
            # a real client: the themed terminal must map
            swaymsg exec foot; sleep 3
            swaymsg -t get_tree | grep -qi foot
            grim /tmp/ci-screenshot-matrix.png
            # live theme switch inside the running compositor
            sway-theme purple; sleep 3
            readlink -f "$HOME/.config/sway-themes/current" | grep -q themes/purple
            swaymsg -t get_tree | grep -qi foot   # session survived the reload
            grim /tmp/ci-screenshot-purple.png
            swaymsg exit || true
          ' || { cat /tmp/sway.log; exit 1; }

      - name: upload screenshot of the running rice
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshots
          path: /tmp/ci-screenshot-*.png
